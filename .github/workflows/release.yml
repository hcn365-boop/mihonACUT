name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - v*

env:
  MIHON_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 1. إضافة صلاحيات الكتابة لمنع خطأ 403
permissions:
  contents: write

jobs:
  get_tag:
    name: Extract tag name
    runs-on: 'ubuntu-26.04'
    outputs:
      tag: ${{ steps.extract.outputs.tag }}

    steps:
      - name: Get tag name
        id: extract
        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

  build:
    name: Build
    runs-on: 'ubuntu-26.04'
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode Keystore
        run: echo "$SIGNING_KEY" | base64 -d > app/release.jks
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build
        run: ./gradlew assembleRelease -Pdist=github
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e
          mkdir -p output_apks
          [ -f app/build/outputs/apk/release/app-universal-release.apk ] && mv app/build/outputs/apk/release/app-universal-release.apk mihonACUT-${{ needs.get_tag.outputs.tag }}.apk || true
          [ -f app/build/outputs/apk/release/app-arm64-v8a-release.apk ] && mv app/build/outputs/apk/release/app-arm64-v8a-release.apk mihonACUT-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk || true
          [ -f app/build/outputs/apk/release/app-armeabi-v7a-release.apk ] && mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk mihonACUT-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk || true
          [ -f app/build/outputs/apk/release/app-x86-release.apk ] && mv app/build/outputs/apk/release/app-x86-release.apk mihonACUT-x86-${{ needs.get_tag.outputs.tag }}.apk || true
          [ -f app/build/outputs/apk/release/app-x86_64-release.apk ] && mv app/build/outputs/apk/release/app-x86_64-release.apk mihonACUT-x86_64-${{ needs.get_tag.outputs.tag }}.apk || true

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mihonACUT-apks
          path: mihonACUT-*.apk

  build_foss:
    name: Build (FOSS)
    runs-on: ubuntu-26.04
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Decode Keystore
        run: echo "$SIGNING_KEY" | base64 -d > app/release.jks
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build
        run: ./gradlew assembleFoss -Pdist=foss
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e
          [ -f app/build/outputs/apk/foss/app-universal-foss.apk ] && mv app/build/outputs/apk/foss/app-universal-foss.apk mihonACUT-${{ needs.get_tag.outputs.tag }}-foss.apk || true

      - name: Upload FOSS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihonACUT-foss-apk
          path: mihonACUT-*-foss.apk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-26.04
    needs: [get_tag, build, build_foss]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get_tag.outputs.tag }}
          name: mihonACUT ${{ needs.get_tag.outputs.tag }}
          body: |
            Check out the [past release notes](https://github.com/hcn365-boop/mihonACUT/releases) if you're upgrading from an earlier version.

            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `mihonACUT-${{ needs.get_tag.outputs.tag }}.apk`
          files: |
            mihonACUT-*.apk
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
